name: Validate V8.3.20
on:
  pull_request:
  push:
    branches: [fix/v8-3-19-supabase-402-cooldown]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile backend
        run: python -m py_compile app.py
      - name: Check embedded JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('app.py').read_text()
          js=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/trading-radar-ui.js').write_text(js)
          assert s.count('V8.3.20')>=3, 'Versionsangaben stimmen nicht überein'
          PY
          node --check /tmp/trading-radar-ui.js
      - name: Check manual trade protection
        run: python -m unittest discover -s tests -p 'test_v8316.py' && python -m unittest discover -s tests -p 'test_v8317.py' && python -m unittest discover -s tests -p 'test_v8318.py' && python -m unittest discover -s tests -p 'test_v8319.py' && python -m unittest discover -s tests -p 'test_v8320.py' -v
