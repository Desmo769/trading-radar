name: Validate Trading Radar live paper changes
on:
  push:
    branches: [feature/live-paper-v8-3-13, feature/live-monitor-v8-3-14]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python syntax
        run: python -m py_compile app.py
      - name: Run simulated live paper trade tests
        run: python -m unittest -v test_live_paper.py
      - name: Import and inspect live logic
        run: |
          python - <<'PY'
          import app
          assert callable(app.live_paper_step)
          assert callable(app.alpaca_stream_loop)
          assert app.LIVE_MAX_SYMBOLS <= 30
          assert app.load()['version'] in app.HTML, 'Version in Daten und UI stimmt nicht überein'
          print('Import and live-paper wiring OK')
          PY
